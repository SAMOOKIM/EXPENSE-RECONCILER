name: Build Windows Portable EXE
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build
        shell: cmd
        run: build_windows_portable.bat
      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Expense_Reconciler_Portable
          path: dist/Expense_Reconciler.exe
